name: Real iPhone installed renderer verification

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Existing same-repository renderer artifact run ID
        required: true
        type: string
      artifact_source:
        description: Exact renderer source SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  renderer:
    if: github.repository == 'mbaykam/HUB' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      ARTIFACT_RUN: ${{ inputs.artifact_run || github.run_id }}
      ARTIFACT_SOURCE: ${{ inputs.artifact_source || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify existing artifact identity for a standalone probe
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'if(!/^[0-9]+$/.test(process.env.ARTIFACT_RUN)||!/^[a-f0-9]{40}$/.test(process.env.ARTIFACT_SOURCE))throw Error("Invalid artifact identity")'
          gh api "repos/mbaykam/HUB/actions/runs/$ARTIFACT_RUN" > "$RUNNER_TEMP/source-run.json"
          node --input-type=module -e 'import {readFileSync} from "node:fs";const run=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/source-run.json"));if(run.repository.full_name!=="mbaykam/HUB"||run.head_sha!==process.env.ARTIFACT_SOURCE||run.status!=="completed")throw Error("Unexpected original run")'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: HUB-installed-ui-${{ env.ARTIFACT_SOURCE }}
          path: mobile/build
          run-id: ${{ env.ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - name: Verify the exact original renderer bytes
        env:
          HUB_PROBE_ARTIFACT_SOURCE_SHA: ${{ env.ARTIFACT_SOURCE }}
        run: node mobile/scripts/verify-installed-ui-artifact.mjs verify
      - name: Exercise the actual renderer in a real iOS application and keyboard-capable window
        env:
          HUB_PROBE_ARTIFACT_SOURCE_SHA: ${{ env.ARTIFACT_SOURCE }}
          HUB_INSTALLED_UI_DOCUMENT_PATH: ${{ github.workspace }}/mobile/build/installed-ui/document.html
        run: node mobile/scripts/check-installed-renderer.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: HUB-ios-renderer-${{ github.sha }}
          path: mobile/build/installed-renderer/evidence
          if-no-files-found: warn
          retention-days: 7
