name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vendor/deepseek-harness/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm harness:stage
      - run: pnpm typecheck
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Prepare the local PDF test runtime
        run: |
          python -m venv "$HOME/.dsh/runtimes/pipecat"
          "$HOME/.dsh/runtimes/pipecat/bin/python" -m pip install -r scripts/tests/requirements-media.txt
          "$HOME/.dsh/runtimes/pipecat/bin/python" -c "import pypdf, defusedxml"
      - run: pnpm test:desktop
