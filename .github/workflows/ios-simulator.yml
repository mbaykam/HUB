name: iOS simulator preparation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "assets/brand/hub-icon.svg", ".github/workflows/ios-simulator.yml"]
  pull_request:
    paths: ["mobile/**", "assets/brand/hub-icon.svg", ".github/workflows/ios-simulator.yml"]

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Check iOS preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm ios:prepare
      - run: pnpm check
  simulator:
    name: Build unsigned iOS foundation
    if: github.event_name == 'workflow_dispatch'
    needs: foundation
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Install the isolated iOS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare bundled content and native dependencies
        run: pnpm ios:prepare
      - name: Check native configuration and bridge boundary
        run: pnpm check
      - name: Test HTTPS authority and native cookie isolation
        run: swift test --package-path native
      - name: Compile for iOS Simulator without Apple credentials
        run: pnpm ios:build:simulator
      - name: Save simulator build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HUB-ios-simulator-${{ github.sha }}
          path: mobile/build/HUB-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
