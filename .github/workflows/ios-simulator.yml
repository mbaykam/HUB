name: iOS simulator preparation

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: Native SDK check (preview is for iOS27 capture development)
        type: choice
        default: stable
        options: [stable, xcode-27]
  push:
    branches: [main]
    paths: ["mobile/**", "assets/brand/hub-icon.svg", ".github/workflows/ios-simulator.yml"]
  pull_request:
    paths: ["mobile/**", "assets/brand/hub-icon.svg", ".github/workflows/ios-simulator.yml"]

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-simulator-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-ui:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ios-installed-ui.yml
  renderer:
    needs: installed-ui
    uses: ./.github/workflows/ios-renderer-probe.yml
  foundation:
    name: Check iOS preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm ios:prepare
      - run: pnpm check
  simulator:
    name: Build unsigned iOS foundation
    if: github.event_name == 'workflow_dispatch'
    needs: [foundation, installed-ui, renderer]
    runs-on: ${{ inputs.toolchain == 'xcode-27' && 'xcode-27' || 'macos-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Install the isolated iOS dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: HUB-installed-ui-${{ github.sha }}
          path: mobile/build
      - name: Verify installed renderer provenance
        run: node scripts/verify-installed-ui-artifact.mjs verify
      - name: Prepare bundled content and native dependencies
        env:
          HUB_REQUIRE_INSTALLED_UI: '1'
        run: pnpm ios:prepare
      - name: Check native configuration and bridge boundary
        run: pnpm check
      - name: Test HTTPS authority and native cookie isolation
        run: swift test --package-path native
      - name: Probe installed document origin with isolated synthetic cookies
        env:
          HUB_RUN_WEBKIT_PROBE: '1'
          HUB_RUN_WEBKIT_TRANSPORT_PROBE: '1'
          HUB_INSTALLED_UI_DOCUMENT_PATH: ${{ github.workspace }}/mobile/build/installed-ui/document.html
          HUB_INSTALLED_UI_EVIDENCE_DIR: ${{ github.workspace }}/mobile/build/installed-ui-evidence
        run: swift test --package-path probes/InstalledUIOrigin
      - name: Probe screen capture SDK availability without conditional imports
        id: screen-sdk
        if: inputs.toolchain == 'xcode-27'
        run: bash scripts/probe-screen-sdk.sh
      - name: Archive actual iPhone Release source without signing
        if: steps.screen-sdk.outputs.iphoneos_available == 'true'
        run: python3 scripts/archive_unsigned.py
      - name: Compile for iOS Simulator without Apple credentials
        run: pnpm ios:build:simulator
      - name: Save simulator build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HUB-ios-simulator-${{ github.sha }}
          path: mobile/build/HUB-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save unsigned iPhone compile evidence
        if: steps.screen-sdk.outputs.iphoneos_available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HUB-ios-device-unsigned-${{ github.sha }}
          path: |
            mobile/build/HUB-ios-device-unsigned.zip
            mobile/build/unsigned-device-proof.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save isolated installed-renderer WebKit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: HUB-installed-ui-webkit-${{ github.sha }}
          path: mobile/build/installed-ui-evidence
          if-no-files-found: warn
          retention-days: 7
