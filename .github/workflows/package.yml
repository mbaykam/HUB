name: Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package target to run
        required: true
        default: all
        type: choice
        options:
          - all
          - win32-x64
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: >-
        ${{
          fromJSON(
            (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'win32-x64')
            && '{"include":[{"runner":"windows-2025","platform":"win32","arch":"x64"}]}'
            || '{"include":[{"runner":"macos-15","platform":"darwin","arch":"arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64"},{"runner":"windows-2025","platform":"win32","arch":"x64"},{"runner":"ubuntu-24.04","platform":"linux","arch":"x64"}]}'
          )
        }}
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vendor/deepseek-harness/pnpm-lock.yaml

      - name: Verify runner target
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: >-
          node -e "if (process.platform !== process.env.EXPECTED_PLATFORM ||
          process.arch !== process.env.EXPECTED_ARCH) { throw new Error(
          'Runner target mismatch: expected ' + process.env.EXPECTED_PLATFORM +
          '-' + process.env.EXPECTED_ARCH + ', received ' + process.platform +
          '-' + process.arch); }"

      - name: Install Linux maker prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage Harness runtime
        run: pnpm harness:stage

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Python for local media tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Prepare Windows media test runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv "$env:USERPROFILE/.dsh/runtimes/pipecat"
          & "$env:USERPROFILE/.dsh/runtimes/pipecat/Scripts/python.exe" -m pip install -r scripts/tests/requirements-media.txt
          if ($LASTEXITCODE -ne 0) { throw 'Media test runtime setup failed' }

      - name: Prepare Unix media test runtime
        if: runner.os != 'Windows'
        run: |
          python -m venv "$HOME/.dsh/runtimes/pipecat"
          "$HOME/.dsh/runtimes/pipecat/bin/python" -m pip install -r scripts/tests/requirements-media.txt

      - name: Test desktop
        run: pnpm test:desktop

      - name: Test Electron runtimes
        if: runner.os == 'macOS'
        run: |
          pnpm test:desktop:about-layout
          pnpm test:desktop:agent-browser-runtime
          pnpm test:desktop:web-tab-links-runtime
          pnpm test:desktop:runtime

      - name: Prepare short Windows package temp
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path 'D:\t' | Out-Null

      - name: Make distributables
        env:
          TEMP: ${{ runner.os == 'Windows' && 'D:\t' || runner.temp }}
          TMP: ${{ runner.os == 'Windows' && 'D:\t' || runner.temp }}
          SQUIRREL_TEMP: ${{ runner.os == 'Windows' && 'D:\t' || runner.temp }}
        run: pnpm make

      - name: Test packaged runtime
        run: pnpm harness:smoke:packaged

      - name: Test Agent Browser conversation
        if: matrix.platform == 'darwin' && matrix.arch == 'arm64'
        run: pnpm test:desktop:agent-browser-conversation:prepared

      - name: Build AppImage from deb
        if: runner.os == 'Linux'
        run: node scripts/forge/appimage.mjs

      - name: Upload distributables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/**/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download distributables
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hub-win32-x64
          path: release-artifacts/hub-win32-x64

      - name: Stage stable installer names
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets

          stage_asset() {
            local destination="$1"
            local artifact="$2"
            local pattern="$3"
            local matches=()
            mapfile -d '' matches < <(
              find "release-artifacts/$artifact" \
                -type f \
                -name "$pattern" \
                -print0
            )
            if (( ${#matches[@]} != 1 )); then
              echo "Expected one $artifact/$pattern asset, found ${#matches[@]}" >&2
              exit 1
            fi
            cp -- "${matches[0]}" "release-assets/$destination"
          }

          stage_asset HUB-windows-x64.exe \
            hub-win32-x64 \
            'HUB-* Setup.exe'

          (
            cd release-assets
            sha256sum HUB-* > SHA256SUMS
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HUB_RELEASE_PROFILE: windows-x64
        run: node scripts/forge/github-release.mjs release-assets
