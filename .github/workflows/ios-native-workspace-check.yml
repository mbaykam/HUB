name: Native iPhone workspace development check

on:
  workflow_dispatch:
  push:
    branches: [codex/ios-native-workspace]
    paths: ["mobile/**", ".github/workflows/ios-native-workspace-check.yml"]

permissions:
  contents: read

concurrency:
  group: ios-native-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    if: github.repository == 'mbaykam/HUB' && github.ref == 'refs/heads/codex/ios-native-workspace'
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm ios:prepare
      - run: pnpm check
      - run: swift test --package-path native
      - run: pnpm ios:build:simulator
